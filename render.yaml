services:
  - type: web
    name: bunker-market-monitor
    runtime: python
    plan: starter
    region: singapore
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 4 --timeout 90 --bind 0.0.0.0:$PORT app:app
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4
      - key: SECRET_KEY
        generateValue: true
      - key: DEMO_MODE
        value: "true"
      - key: ENABLE_SCHEDULER
        value: "true"
      - key: REFRESH_INTERVAL_MINUTES
        value: "30"
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: MSAL_CLIENT_ID
        sync: false
      - key: MSAL_CLIENT_SECRET
        sync: false
      - key: MSAL_TENANT
        value: common
      - key: MSAL_REDIRECT_URI
        sync: false
      - key: GRAPH_REFRESH_INTERVAL_MINUTES
        value: "5"
      - key: DATABASE_PATH
        value: /var/data/bunker-market-monitor.db
      - key: BULUGO_API_KEY
        sync: false
      - key: OILPRICEAPI_KEY
        sync: false
    disk:
      name: bunker-monitor-data
      mountPath: /var/data
      sizeGB: 1
